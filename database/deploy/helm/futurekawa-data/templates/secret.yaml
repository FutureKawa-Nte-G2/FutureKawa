# Mot de passe du compte de lecture (référencé par CNPG managed.roles).
# Les creds owner/superuser restent gérés par CNPG (secret <cluster>-app).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "futurekawa-data.fullname" . }}-role-apiread
  labels:
    {{- include "futurekawa-data.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: apiread
  password: {{ .Values.postgres.roles.apiReadPassword | quote }}
{{- if .Values.postgres.backup.enabled }}
---
# Credentials object-store pour la sauvegarde CNPG (barman).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "futurekawa-data.secretName" . }}
  labels:
    {{- include "futurekawa-data.labels" . | nindent 4 }}
type: Opaque
stringData:
  BACKUP_S3_KEY_ID: {{ .Values.postgres.backup.s3KeyId | default "" | quote }}
  BACKUP_S3_SECRET: {{ .Values.postgres.backup.s3Secret | default "" | quote }}
{{- end }}
