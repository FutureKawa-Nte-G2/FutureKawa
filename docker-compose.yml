name: futurekawa

services:
  odoo-db:
    image: postgres:16
    container_name: futurekawa-odoo-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:18.0
    container_name: futurekawa-odoo
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo-addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
    environment:
      HOST: odoo-db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    restart: unless-stopped

  # Base applicative du backend siège. Identifiants alignés sur
  # appsettings.Development.json.
  siege-db:
    image: postgres:16
    container_name: futurekawa-siege-db
    ports:
      - "127.0.0.1:${SIEGE_DB_PORT:-5435}:5432"
    environment:
      POSTGRES_DB: ${SIEGE_DB_NAME:-FutureKawaSiege}
      POSTGRES_USER: ${SIEGE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SIEGE_DB_PASSWORD:-Not24get}
    volumes:
      - siege-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIEGE_DB_USER:-postgres} -d ${SIEGE_DB_NAME:-FutureKawaSiege}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  odoo-db-data:
  odoo-data:
  siege-db-data: