name: futurekawa

services:
  odoo-db:
    image: postgres:16
    container_name: futurekawa-odoo-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:18.0
    container_name: futurekawa-odoo
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo-addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
    environment:
      HOST: odoo-db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    restart: unless-stopped

  # Base d'un pays, lue par l'API locale (Api/). Séparée de celle d'Odoo :
  # l'architecture prévoit un backend autonome par pays, et le siège vient les
  # interroger par HTTP. Port 5434 pour ne pas heurter odoo-db (5433) ni un
  # PostgreSQL installé sur la machine (5432).
  warehouse-db:
    # timescale = postgres 16 + l'extension timescaledb (measurements est une
    # hypertable, cf. migration initiale). Même version que l'image CNPG k8s.
    image: timescale/timescaledb:2.17.2-pg16
    container_name: futurekawa-warehouse-db
    ports:
      - "${WAREHOUSE_DB_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB_NAME:-futurekawa_br}
      POSTGRES_USER: ${WAREHOUSE_DB_USER:-futurekawa}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-futurekawa}
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_DB_USER:-futurekawa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base applicative du backend siège. Identifiants alignés sur
  # appsettings.Development.json.
  siege-db:
    image: postgres:16
    container_name: futurekawa-siege-db
    ports:
      - "127.0.0.1:${SIEGE_DB_PORT:-5435}:5432"
    environment:
      POSTGRES_DB: ${SIEGE_DB_NAME:-FutureKawaSiege}
      POSTGRES_USER: ${SIEGE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SIEGE_DB_PASSWORD:-Not24get}
    volumes:
      - siege-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIEGE_DB_USER:-postgres} -d ${SIEGE_DB_NAME:-FutureKawaSiege}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  odoo-db-data:
  odoo-data:
  warehouse-db-data:
  siege-db-data:
