# FutureKawa — Mosquitto (pont MQTT pub/sub, aucune logique).
listener 1883
# Proto : anonyme. Durcissement (auth user/pass + ACL par topic) = évolution.
allow_anonymous true

# persistance requise pour que QoS 1 survive à un redémarrage du broker.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
