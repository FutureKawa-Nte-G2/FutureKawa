apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "futurekawa-siege.fullname" . }}-frontend
  labels:
    {{- include "futurekawa-siege.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "futurekawa-siege.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          # Aucune variable d'API ici : les NEXT_PUBLIC_* sont inlinées dans le
          # bundle au moment du build. L'URL de l'API est donc fixée par
          # --build-arg, pas par ce Deployment (cf. values.yaml).
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "futurekawa-siege.fullname" . }}-frontend
  labels:
    {{- include "futurekawa-siege.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
