{{- if .Values.ingress.enabled }}
# Frontend et API sur la même origine. Ce n'est pas cosmétique : le cookie de
# refresh est SameSite=Strict, et deux origines distinctes l'empêcheraient
# d'être envoyé — la reconnexion silencieuse au chargement échouerait.
# L'ordre des règles compte : /api doit précéder /, sinon le frontend capte tout.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "futurekawa-siege.fullname" . }}
  labels:
    {{- include "futurekawa-siege.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "futurekawa-siege.fullname" . }}-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "futurekawa-siege.fullname" . }}-frontend
                port:
                  number: 3000
{{- end }}
