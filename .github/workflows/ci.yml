name: CI-DOTNET-BACK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FutureKawaSiege.slnx

      - name: Build
        run: dotnet build FutureKawaSiege.slnx --configuration Release --no-restore

      - name: Run tests with coverage
        run: >
          dotnet test FutureKawaSiege.slnx
          --configuration Release
          --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload coverage
        # La couverture était collectée dans TestResults mais jamais exposée :
        # elle disparaissait avec le runner. `if: always()` la publie aussi
        # quand un test échoue, moment où elle est le plus utile.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: backend/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
