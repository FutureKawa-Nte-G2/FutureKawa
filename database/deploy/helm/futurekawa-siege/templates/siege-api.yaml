apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "futurekawa-siege.fullname" . }}-api
  labels:
    {{- include "futurekawa-siege.labels" . | nindent 4 }}
    app.kubernetes.io/component: siege-api
spec:
  replicas: {{ .Values.siegeApi.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: siege-api
  template:
    metadata:
      labels:
        {{- include "futurekawa-siege.labels" . | nindent 8 }}
        app.kubernetes.io/component: siege-api
    spec:
      initContainers:
        {{- include "futurekawa-siege.waitForDb" . | nindent 8 }}
      containers:
        - name: api
          image: {{ .Values.siegeApi.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "futurekawa-siege.apiEnv" . | nindent 12 }}
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # Ne pas renseigner ASPNETCORE_HTTPS_PORTS : sans endpoint HTTPS lié,
            # UseHttpsRedirection() resterait inerte et redirigerait vers un port fermé.
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            # Frontend et API partagent l'origine de l'Ingress : aucune requête
            # n'est cross-origin, mais la valeur reste exacte si l'un des deux
            # venait à être exposé séparément.
            - name: Cors__AllowedOrigins__0
              value: http://{{ .Values.ingress.host }}
            - name: MeasurementSync__UseMockData
              value: "false"
            - name: MeasurementSync__LocalApiUrl
              value: {{ .Values.warehouseApiUrl | quote }}
          # Les migrations tournent dans un hook post-install : au tout premier
          # déploiement l'API peut démarrer avant que le schéma n'existe et
          # redémarrer une ou deux fois. La readiness l'empêche de recevoir du
          # trafic entre-temps.
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- with .Values.siegeApi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "futurekawa-siege.fullname" . }}-api
  labels:
    {{- include "futurekawa-siege.labels" . | nindent 4 }}
    app.kubernetes.io/component: siege-api
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: siege-api
  ports:
    - name: http
      port: 8080
      targetPort: http
